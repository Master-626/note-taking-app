[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "note-taking-app"
version = "0.1.0"
description = "A full-featured CLI note-taking application with Markdown support, tags, and search."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }]
dependencies = ["click>=8.0.0", "rich>=13.0.0"]

[project.scripts]
notes = "note_taking.cli:main"

[project.urls]
Homepage = "https://github.com/Master-626/note-taking-app"
