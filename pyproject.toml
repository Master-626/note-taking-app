[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "note-taking-app"
version = "0.2.0"
description = "A local SQLite note CLI with persisted titles and bodies, listing, and literal search."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }]
dependencies = ["click>=8.0.0", "rich>=13.0.0"]

[project.scripts]
notes = "note_taking.cli:main"

[project.urls]
Homepage = "https://github.com/Master-626/note-taking-app"

[tool.hatch.build.targets.wheel]
packages = ["src/note_taking"]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "build>=1", "hatchling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
